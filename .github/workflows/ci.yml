name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 연속 푸시가 러너를 겹쳐 잡지 않게 한다. 낡은 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # 패키지가 리포 루트가 아니다.
    working-directory: Packages/Jirarcade

jobs:
  test:
    runs-on: macos-26
    # 기본 잡 타임아웃은 360분이고 macOS 러너는 10배 단가로 과금된다.
    # 멈춘 테스트나 입력을 기다리는 명령 하나가 가장 비싼 분을 여섯 시간 태우게 두지 않는다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 툴체인을 핀으로 박지 않는다. Package.swift가 swift-tools-version 6.2를
      # 요구하므로 러너가 낮아지면 빌드가 즉시 실패하고, 올라가면 이 로그가
      # 릴리즈보다 먼저 알려준다. 릴리즈 워크플로는 반대로 명시 핀을 쓴다 —
      # CI는 "미래에 깨지나"를, 릴리즈는 "어제와 같은가"를 알고 싶기 때문이다.
      - name: 툴체인 확인
        run: |
          swift --version
          xcodebuild -version
          echo "설치된 Xcode:"
          find /Applications -maxdepth 1 -iname 'Xcode*' -print || true

      - name: 빌드
        run: swift build --build-tests

      - name: 테스트
        run: swift test

      # make-app.sh와 verify-bundle.sh는 v* 태그를 밀기 전까지 한 번도 실행되지
      # 않아, 두 스크립트의 버그가 공개된 태그 위에서만 드러난다. 유니버설은
      # 쓰지 않아 빠르다 — 여기서는 인자 처리와 번들 구조만 확인하면 된다.
      - name: 번들 스모크
        working-directory: .
        run: |
          ./scripts/make-app.sh --config release --version 0.0.0-ci --build 0
          ./scripts/verify-bundle.sh Packages/Jirarcade/.build/Jirarcade.app 0.0.0-ci

      # install.sh·make-cask.sh·verify-install.sh도 v* 태그를 밀기 전까지 한 번도
      # 실행되지 않으면, 버그가 공개된 태그 위에서만 드러난다. 번들 스모크와 같은
      # 이유로 여기서 돌린다.
      #
      # 앞 스텝이 만든 0.0.0-ci 번들을 검사 대상으로 재사용한다. 로컬에서 만든
      # 번들에는 격리 표시가 없으므로 verify-install.sh의 성공 경로가 그대로 성립한다.
      - name: 설치 스크립트 스모크
        working-directory: .
        run: |
          bash -n scripts/install.sh
          ./scripts/test-install.sh
          ./scripts/test-make-cask.sh
          ./scripts/verify-install.sh Packages/Jirarcade/.build/Jirarcade.app 0.0.0-ci
