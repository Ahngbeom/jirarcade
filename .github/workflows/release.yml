name: Release

on:
  push:
    tags: ['v*']

permissions:
  # 릴리즈 생성에 필요한 최소 권한. 그 외는 부여하지 않는다.
  contents: write

jobs:
  release:
    runs-on: macos-26
    # 설치 채널 잡이 릴리즈 잡의 결과를 읽는다. sha256을 다시 계산하지 않는 것이
    # 요점이다 — 두 곳이 따로 계산하면 어긋나도 아무도 모른다.
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      # 릴리즈는 재현성이 우선이라 툴체인을 명시적으로 박는다. 경로가 사라지면
      # 즉시 실패하는데, 조용히 다른 버전으로 빌드되는 것보다 낫다.
      - name: Xcode 고정
        run: |
          if [ ! -d /Applications/Xcode_26.2.app ]; then
            echo "✗ /Applications/Xcode_26.2.app이 이 러너에 없습니다" >&2
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.2.app
          swift --version
          ACTUAL_VERSION="$(xcodebuild -version | awk '/^Xcode/ {print $2}')"
          if [ "$ACTUAL_VERSION" != "26.2" ]; then
            echo "✗ 핀이 적용되지 않았습니다: xcodebuild가 ${ACTUAL_VERSION}을 보고했습니다 (기대값 26.2)" >&2
            exit 1
          fi

      # 형식이 어긋난 태그는 여기서 죽인다. v0.2 같은 값이 그대로
      # CFBundleShortVersionString에 들어가면 나중에 조용히 이상해진다.
      - name: 태그 검증 및 버전 추출
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "✗ 태그 형식이 올바르지 않습니다: $TAG (예: v0.2.0, v0.2.0-rc.1)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 프리릴리즈는 '최신 릴리즈' 자리를 차지하지 않는다.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # 태그는 임의의 커밋에 붙을 수 있다 — CI를 통과한 적 없는 커밋에도.
      # 게이트는 릴리즈되는 바로 그 트리에서 서야 의미가 있다.
      - name: 테스트 게이트
        working-directory: Packages/Jirarcade
        run: swift test

      - name: 번들 생성
        run: |
          ./scripts/make-app.sh \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ github.run_number }}" \
            --config release \
            --universal

      - name: 출하 전 검증
        run: |
          ./scripts/verify-bundle.sh \
            Packages/Jirarcade/.build/Jirarcade.app \
            "${{ steps.version.outputs.version }}" \
            --universal

      # zip이 아니라 ditto다. zip은 확장 속성과 심볼릭 링크를 잃어
      # 압축을 푼 .app의 서명이 깨진다.
      #
      # scripts/verify-bundle.sh의 압축 왕복 검사도 같은 ditto 플래그를 쓴다.
      # 여기서 플래그를 바꾸면 그쪽도 맞춰 바꿔야 한다 — 안 그러면 검증이
      # 통과해도 실제로 배포되는 zip은 다른 방식으로 만들어진 것이다.
      - name: 압축
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            Packages/Jirarcade/.build/Jirarcade.app \
            "Jirarcade-${{ steps.version.outputs.version }}.zip"

      # 릴리즈 공개 **전**이다. make-cask.sh의 버그나 문법 오류는 여기서 죽어야
      # 하고, 그러면 아무것도 나가지 않는다. 공개 후에 죽으면 되돌릴 수 없다.
      #
      # 체크섬은 여기서 한 번만 계산해 릴리즈 자산과 cask 양쪽에 넣는다.
      - name: 체크섬과 cask 생성
        id: checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="Jirarcade-${VERSION}.zip"
          shasum -a 256 "$ZIP" > "${ZIP}.sha256"
          SHA="$(awk '{print $1}' "${ZIP}.sha256")"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "--- ${ZIP}.sha256 ---"
          cat "${ZIP}.sha256"

          ./scripts/make-cask.sh --version "$VERSION" --sha256 "$SHA" --output jirarcade.rb
          ruby -c jirarcade.rb
          echo "--- 생성된 cask ---"
          cat jirarcade.rb

      # --notes-file과 --generate-notes를 함께 넘겼을 때 합쳐지는 방식이
      # 문서화돼 있지 않아, 생성 노트를 API로 직접 받아 헤더 뒤에 붙인다.
      - name: 릴리즈 노트 작성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q '{{VERSION}}' .github/release-notes-header.md; then
            echo "✗ release-notes-header.md에 {{VERSION}} 자리표시자가 없습니다 — 파일명과 본문이 어긋납니다" >&2
            exit 1
          fi
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes-header.md > notes.md
          printf '\n---\n\n' >> notes.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body' >> notes.md
          echo "--- 생성된 릴리즈 본문 ---"
          cat notes.md

      # 초안으로 만들고 자산 업로드가 끝난 뒤에 공개로 바꾼다. gh release create는
      # 릴리즈를 먼저 게시하고 나서 자산을 올리므로, 50MB짜리 zip 업로드가
      # 중간에 끊기면 다운로드할 게 없는 릴리즈가 이미 공개돼 있게 된다.
      - name: 릴리즈 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARGS=(--draft --title "Jirarcade ${VERSION}" --notes-file notes.md)
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${ARGS[@]}" \
            "Jirarcade-${VERSION}.zip" \
            "Jirarcade-${VERSION}.zip.sha256"
          gh release edit "${GITHUB_REF_NAME}" --draft=false

  # 릴리즈 공개는 되돌릴 수 없다. 그 뒤의 실패에는 재실행 경로를 준다 — 별도 잡이면
  # "Re-run failed jobs"가 릴리즈를 다시 만들지 않고 이 잡만 다시 돈다.
  install-channels:
    needs: release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 프리릴리즈는 '최신 릴리즈' 자리를 차지하지 않는다. tap도 같다 —
      # brew 사용자는 안정판만 받는다.
      - name: tap 갱신
        if: needs.release.outputs.prerelease == 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          # 조용히 건너뛰면 릴리즈가 나가도 tap이 갱신되지 않은 것을 아무도 모른다.
          # make-app.sh가 codesign 실패를 삼키지 않기로 한 것과 같은 판단이다.
          if [ -z "$TAP_TOKEN" ]; then
            echo "✗ HOMEBREW_TAP_TOKEN 시크릿이 없습니다 — tap을 갱신할 수 없습니다" >&2
            echo "  fine-grained PAT (ahngbeom/homebrew-tap, Contents: Read and write)를" >&2
            echo "  이 저장소의 Actions secret으로 등록하세요." >&2
            exit 1
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ahngbeom/homebrew-tap.git" tap
          ./scripts/make-cask.sh --version "$VERSION" --sha256 "$SHA256" --output tap/Casks/jirarcade.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Casks/jirarcade.rb; then
            echo "▸ cask에 변경이 없습니다 — 이미 최신입니다"
            exit 0
          fi

          git add Casks/jirarcade.rb
          git commit -m "Brew cask update for jirarcade version v${VERSION}"

          # tap은 다른 프로젝트도 함께 쓴다. 동시 릴리즈가 겹치면 non-fast-forward로
          # 밀린다. 재실행으로도 회복되지만, 여기서 세 번까지는 스스로 붙여본다.
          for attempt in 1 2 3; do
            if git push; then
              echo "✓ tap 갱신 완료: v${VERSION}"
              exit 0
            fi
            echo "▸ push 충돌 — rebase 후 재시도 (${attempt}/3)"
            git pull --rebase
          done

          echo "✗ tap push에 실패했습니다" >&2
          exit 1

      # 사용자가 칠 명령을 그대로 친다. verify-bundle.sh의 압축 왕복 검사와 같은
      # 발상이다 — 받는 쪽 경로를 먼저 밟아본다.
      #
      # verify-install.sh 실패 시 uninstall을 건너뛰어도 재실행이 안전한 것은 이
      # 잡이 GitHub-hosted 러너(매 실행 새 VM)에서 돈다는 전제 때문이다. 설치된
      # 앱이 다음 실행까지 남지 않으니 "Re-run failed jobs"는 항상 install부터
      # 다시 시작한다. self-hosted나 영속 러너로 옮기면 이 전제가 깨진다 — 그때는
      # brew install에 --force를 주거나, 스모크 앞에 기존 cask 제거 단계를 넣어
      # 이미 설치된 상태를 견디게 만들어야 한다.
      - name: brew 설치 스모크
        if: needs.release.outputs.prerelease == 'false'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          brew install --cask ahngbeom/tap/jirarcade
          ./scripts/verify-install.sh /Applications/Jirarcade.app "$VERSION"
          brew uninstall --cask jirarcade

      # 워크스페이스의 스크립트를 돌린다. raw.githubusercontent가 아니라 이 커밋의
      # 파일을 검증하려는 것이다.
      #
      # 프리릴리즈에서는 releases/latest가 이 태그를 찾지 못한다. JIRARCADE_VERSION이
      # 존재하는 이유가 이것이고, 프리릴리즈 리허설에서 curl 경로를 검증하는 방법이다.
      - name: curl 설치 스모크
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          JIRARCADE_VERSION="$VERSION" bash scripts/install.sh
          ./scripts/verify-install.sh /Applications/Jirarcade.app "$VERSION"
